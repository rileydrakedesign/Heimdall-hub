# ─── Ideas (not yet in development) ───

  - id: scene-splitter
    name: Scene Splitter — AI Scene Generation & Asset Extraction
    status: idea
    priority: medium
    tags: [ai, creative-tools, nano-banana]
    notes: >
      Productize the Nano Banana + Claude scene creation pipeline used for the portfolio.
      Users describe a scene → AI generates a consistent composed image → app automatically
      splits it into individual assets (transparent PNGs with metadata). Target: game devs,
      indie creators, designers who need consistent asset packs from a single prompt.
      Core tech already proven in the portfolio isometric room workflow.

  - id: polymarket-sentiment
    name: Prediction Market Sentiment Tracker
    status: idea
    priority: medium
    tags: [data, sentiment, markets, chatbot]
    notes: >
      Sentiment analysis tool built on prediction market data (Polymarket, Kalshi, etc.).
      NOT for placing bets — surfaces where money is flowing as a proxy for real-world
      sentiment. Think Exploding Topics but powered by odds movements. Shows what's
      blowing up, trending, and shifting. Features: trend dashboard with spikes/movers,
      built-in chat interface for natural language queries ("what are people betting on
      in AI regulation?"), and an API for programmatic access. Data layer ingests
      market odds over time and computes momentum/velocity signals.

  - id: dev-infra-agent
    name: Agentic Developer Infrastructure Dashboard
    status: active
    priority: high
    owner: Heimdall
    next_action: "MVP: implement GitHub webhook signature verification + enqueue stub scan job + write back a graph snapshot + Mermaid diagram to /docs/architecture/ on PR."
    due: null
    links:
      - label: Repo
        url: "https://github.com/rileydrakedesign/dev-infra-agent"
    tags: [devtools, agents, github, infrastructure]
    notes: >
      GitHub-integrated agent that acts as commit-triggered middleware. On each push/PR,
      a multi-agent system audits the codebase: constructs/updates an infrastructure map
      (system design diagram), validates architecture docs, and surfaces it all in a
      clean developer dashboard. Core loop: commit → agent audit → update infra diagram
      + architecture docs + dashboard. Docs are agent-consumable so coding agents can
      reference accurate, up-to-date system context.

  - id: card-optimizer
    name: Credit Card Optimizer — Personalized Card Recommendations via Plaid
    status: idea
    priority: medium
    tags: [fintech, plaid, affiliate, data]
    notes: >
      Users connect their bank via Plaid → spending history is categorized (groceries,
      travel, dining, gas, subscriptions, etc.) → engine ranks credit cards by projected
      rewards based on the user's actual spending proportions. Shows: top card recommendations
      ranked by net ROI (rewards earned minus annual fees), historical backtest ("you would
      have earned $X last year with this card"), and year-over-year comparison. Free to user,
      monetized through credit card affiliate revenue. One-time or low-friction signup,
      not a subscription. Key moat: personalized to real spending data, not generic
      "best cards" listicles.
