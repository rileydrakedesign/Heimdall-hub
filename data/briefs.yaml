# Morning Brief profiles + sources (static-first)
# This file is designed to be:
# - easy to edit via PR
# - easy for agents to read/write
# - later importable into Supabase tables

briefs:
  - id: personal-morning
    name: "Personal Morning Brief"
    enabled: true

    # Output + style controls
    output:
      format: "markdown"
      max_minutes_to_read: 7
      bullet_style: "tight" # tight | normal
      require_sources: true

    sections:
      - id: exec
        title: "Top 5"
        kind: "summary"
        max_bullets: 5

      - id: current_events
        title: "Current Events"
        kind: "news"
        max_bullets: 10
        sources_ref: "news_general"

      - id: markets
        title: "Markets"
        kind: "markets"
        max_bullets: 12
        sources_ref: "markets_default"

      - id: ai
        title: "AI / Dev"
        kind: "ai"
        max_bullets: 10
        sources_ref: "ai_default"

      - id: local
        title: "Local"
        kind: "local"
        enabled: false
        max_bullets: 6
        sources_ref: "local_default"

sources:
  # Replace with your preferred sources when home.
  - id: news_general
    kind: rss
    feeds:
      - name: "The Economist — The World This Week"
        url: "https://www.economist.com/the-world-this-week/rss.xml"
      - name: "Financial Times — World"
        url: "https://www.ft.com/world?format=rss"
        enabled: false
        notes: "FT returns HTTP 406 to server fetches. Re-enable once we add cookie/browser fetch support or swap to a working FT feed."
      - name: "Hacker News — Front Page"
        url: "https://hnrss.org/frontpage"

  - id: markets_default
    kind: markets
    mode: top_movers
    top_movers:
      universe:
        # v1: liquid, widely-followed universe to approximate "top movers"
        # (we can expand to true market-wide movers later)
        tickers: ["AAPL","MSFT","NVDA","AMZN","GOOGL","META","TSLA","NFLX","AMD","INTC","ORCL","CRM","ADBE","AVGO","QCOM","TSM","ARM","IBM","PLTR","SHOP","SNOW","UBER","LYFT","SPOT","BA","CAT","XOM","CVX","JPM","GS","BAC","V","MA","UNH","LLY","NKE","COST","WMT","KO","PEP"]
      limit: 10
    notes: "v1: compute top movers (by absolute % change) from a liquid universe. Later: true market-wide movers + Riley watchlist + sectors."

  - id: ai_default
    kind: ai
    mode: aggregate
    notes: "v1: blend AI product/news + research. Later: add pinned sources + keyword tuning."
    arxiv:
      categories: ["cs.AI", "cs.LG"]
      keywords: ["agent", "tool", "reasoning", "eval", "inference", "rlhf", "rl", "alignment", "multimodal", "rag"]
    rss:
      feeds:
        - name: "Hacker News — AI"
          url: "https://hnrss.org/newest?q=ai"

  - id: ops_default
    kind: ops
    inputs:
      - "data/projects.yaml"
      - "data/tasks.yaml"
      - "HEARTBEAT.md"

# (Optional) separate work brief profile can be added later that uses ops_default.

  - id: local_default
    kind: local
    weather:
      location: "(set later)"
    surf:
      location: "(set later)"
